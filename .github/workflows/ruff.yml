name: CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Важно: загружаем все ветки для корректной работы
        fetch-depth: 0
    
    - name: Debug - Check repository structure
      run: |
        echo "=== Repository structure ==="
        ls -la
        echo ""
        echo "=== Test directory ==="
        ls -la test/ 2>/dev/null || echo "Test directory not found"
        echo ""
        echo "=== Python files in test/ ==="
        find test/ -name "*.py" -o -name "test_*.py" 2>/dev/null | head -10
        echo ""
        echo "=== Existing pytest.ini ==="
        cat pytest.ini 2>/dev/null || echo "No pytest.ini in repository"
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
    
    - name: Setup PYTHONPATH and test discovery
      run: |
        # Устанавливаем PYTHONPATH для импорта из src
        export PYTHONPATH="$GITHUB_WORKSPACE/src:$PYTHONPATH"
        echo "PYTHONPATH: $PYTHONPATH"
        
        # Проверяем, видит ли pytest тесты
        echo ""
        echo "=== Pytest test discovery ==="
        python -m pytest --collect-only 2>&1 | head -30 || true
        
        # Если не находит, пробуем искать по-другому
        echo ""
        echo "=== Alternative discovery ==="
        python -m pytest test/ --collect-only 2>&1 | head -30 || true
    
    - name: Run tests
      run: |
        # Основной запуск тестов
        export PYTHONPATH="$GITHUB_WORKSPACE/src:$PYTHONPATH"
        
        echo "=== Running tests ==="
        
        # Сначала пробуем с существующим pytest.ini
        if [ -f pytest.ini ]; then
          echo "Using existing pytest.ini"
          python -m pytest -v --tb=short
        else
          # Если нет pytest.ini, создаем минимальный
          echo "Creating minimal pytest.ini"
          cat > pytest.ini << EOF
          [pytest]
          testpaths = test
          pythonpath = ./src
          addopts = -v --tb=short
          EOF
          python -m pytest -v --tb=short
        fi
