name: Tests

on: 
  push:
    paths:
      - '**.py'
      - 'test/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with: 
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest ruff
    
    - name: Run Ruff
      run: ruff check --output-format=github .
    
    - name: Check for test directories
      id: check-tests
      run: |
        if [ -d "tests" ] && [ -n "$(ls -A tests/*.py 2>/dev/null)" ]; then
          echo "has_tests=true" >> $GITHUB_OUTPUT
          echo "test_dir=tests" >> $GITHUB_OUTPUT
        elif [ -d "test" ] && [ -n "$(ls -A test/*.py 2>/dev/null)" ]; then
          echo "has_tests=true" >> $GITHUB_OUTPUT
          echo "test_dir=test" >> $GITHUB_OUTPUT
        else
          echo "has_tests=false" >> $GITHUB_OUTPUT
          echo "No Python test files found." >&2
        fi
    
    - name: Run tests
      if: steps.check-tests.outputs.has_tests == 'true'
      run: |
        echo "Running tests from directory: ${{ steps.check-tests.outputs.test_dir }}"
        python -m pytest ${{ steps.check-tests.outputs.test_dir }}/ -v
    
    - name: Skip tests (no test files)
      if: steps.check-tests.outputs.has_tests == 'false'
      run: |
        echo "No test files found. Skipping pytest."
        echo "To add tests, create a 'tests/' directory with *_test.py files."
