name: Tests

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest
    
    - name: Run Ruff
      run: ruff check --output-format=github
    
    - name: Check for test files
      id: check-tests
      run: |
        # Проверяем разные варианты названий директорий
        if [ -d "test" ] && [ -n "$(find test -name '*.py' -type f)" ]; then
          echo "test_dir=test" >> $GITHUB_OUTPUT
          echo "has_tests=true" >> $GITHUB_OUTPUT
        elif [ -d "tests" ] && [ -n "$(find tests -name '*.py' -type f)" ]; then
          echo "test_dir=tests" >> $GITHUB_OUTPUT
          echo "has_tests=true" >> $GITHUB_OUTPUT
        else
          echo "has_tests=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Create dummy tests if none exist
      if: steps.check-tests.outputs.has_tests == 'false'
      run: |
        echo "No test files found. Creating dummy tests..."
        mkdir -p tests
        cat > tests/test_dummy.py << 'EOF'
